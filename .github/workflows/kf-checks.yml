name: KF Style checks
on:
  push:
    branches: ["feature/kf-full-migration"]
  pull_request:
    paths:
      - "generator/**"
      - "contracts/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/kf-checks.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run slides:build:example
      - name: Inspect generated PPTX
        run: |
          test -s generator/output/kf-proposal.pptx
          unzip -t generator/output/kf-proposal.pptx >/dev/null

      - name: QA Korn Ferry company overview (5 slides)
        run: node generator/qa-deck.mjs generator/examples/kf-company-overview-5slides.json
      - name: Build Korn Ferry company overview
        run: node generator/render-deck.mjs generator/examples/kf-company-overview-5slides.json generator/output/kf-company-overview-5slides.pptx
      - name: Verify generated 5-page PowerPoint
        run: |
          test -s generator/output/kf-company-overview-5slides.pptx
          unzip -t generator/output/kf-company-overview-5slides.pptx >/dev/null
          test "$(unzip -Z1 generator/output/kf-company-overview-5slides.pptx | grep -Ec '^ppt/slides/slide[0-9]+\.xml$')" -eq 5
      - uses: actions/upload-artifact@v4
        with:
          name: kf-company-overview-5slides
          path: generator/output/kf-company-overview-5slides.pptx
